plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.nexastream.app'
    compileSdk 35

    def properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())

    defaultConfig {
        applicationId "com.nexastream.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "APP_LAYOUT", "\"${properties.getProperty("APP_LAYOUT", "mobile")}\""
        buildConfigField "String", "TMDB_API_KEY", "\"${properties.getProperty("TMDB_API_KEY", "c63c538c7ac3256ef3fd2f3a3fb352aa")}\""
        buildConfigField "String", "RABBITSTREAM_SOURCE_API", "\"${properties.getProperty("RABBITSTREAM_SOURCE_API", "https://rabbitstream.net/ajax/v2/embed-4/getSources?id=")}\""
        buildConfigField "String", "SUBDL_API_KEY", "\"${properties.getProperty("SUBDL_API_KEY", "")}\""
    }

    sourceSets {
        main {
            def appLayout = properties.getProperty("APP_LAYOUT", "mobile")
            if (appLayout == "mobile") {
                manifest.srcFile "${project.projectDir}/src/main/mobile/AndroidManifest.xml"
            } else if (appLayout == "tv") {
                manifest.srcFile "${project.projectDir}/src/main/tv/AndroidManifest.xml"
            } else {
                manifest.srcFile "${project.projectDir}/src/main/AndroidManifest.xml"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-Xcontext-receivers"
        ]
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
        viewBinding true
        dataBinding true
    }
}

